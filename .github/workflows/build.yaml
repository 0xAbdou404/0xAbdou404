# Rebuilds the profile card with live GitHub stats.
#
# Requires ONE repository secret: ACCESS_TOKEN
#   Settings > Secrets and variables > Actions > New repository secret
#   Name it ACCESS_TOKEN and paste a GitHub personal access token
#   (see SETUP.md for the exact scopes). USER_NAME is filled in automatically
#   from the repo owner, so you don't need a second secret.
#
# Runs: once a day, on demand (the "Run workflow" button), and whenever you
# push a change to the generator itself. The bot's own commits touch only the
# generated files, which are NOT in the push "paths" filter, so it never
# retriggers itself.

name: Update profile card

on:
  schedule:
    - cron: "0 4 * * *"        # every day at 04:00 UTC
  workflow_dispatch: {}         # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "update_stats.py"
      - "generate.py"
      - "assets/portrait_*.png"
      - ".github/workflows/build.yaml"

permissions:
  contents: write               # allow the bot to commit the refreshed card

concurrency:
  group: update-profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries (cairo + monospace font)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install --upgrade requests pycairo

      - name: Fetch live stats and rebuild the card
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python update_stats.py

      - name: Commit the refreshed card
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json assets/dark_mode.svg assets/light_mode.svg cache
          git commit -m "chore: refresh profile stats [skip ci]" || echo "Nothing changed."
          git push
